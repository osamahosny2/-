name: Apply Iruma source fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply source fixes
        run: python scripts/iruma_source_fix.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/connector/ConnectorEngine.kt app/src/main/java/com/example/ui/MangaViewModel.kt app/src/main/java/com/example/ui/screens/BrowseScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve manga source search and pagination"
          git push
