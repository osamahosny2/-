name: Build Iruma Manga 1.3.0

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Iruma Manga 1.3.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iruma-Manga-1.3.0
          path: app/build/outputs/apk/debug/Iruma Manga 1.3.0.apk
